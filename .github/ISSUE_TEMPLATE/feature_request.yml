name: Feature request
description: Suggest something vutuv should be able to do.
labels: ["Feature Request"]
body:
  - type: markdown
    attributes:
      value: |
        **Write the title so it names something you can point at** — a page, a
        control, a mail — and what should change about it. That title is all we
        see in the list.

        **Then three sentences.** What is hard today, what should happen
        instead, who it helps. Not a specification: prose. A mockup or a link
        to prior art carries more than three paragraphs. If you are letting an
        AI agent write this, give it that ceiling — left alone it will produce
        a spec nobody asked for.

  - type: textarea
    id: what
    attributes:
      label: What should change
      description: >-
        Three sentences of prose. What is awkward today, what should happen
        instead, and who notices. If there is a neighbouring idea you are
        *not* asking for, one more sentence naming it saves a long thread.
      placeholder: |
        A qualification's page does not say which jobs it earned, so the one
        thing people want to know about a certificate is missing. It should
        list the work experiences that cite it. This helps anybody deciding
        whether a qualification is worth having.
    validations:
      required: true

  - type: textarea
    id: where
    attributes:
      label: Where
      description: >-
        Optional. The page or URL this is about, and a mockup or screenshot if
        you have one.
      placeholder: |
        /wintermeyer/qualifications/erste-hilfe
