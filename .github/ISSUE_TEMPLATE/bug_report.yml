name: Bug report
description: Something is broken.
labels: ["Bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Write the title so it names something you can point at** — a page, a
        button, a mail — and what is wrong with it. That title is all we see in
        the list.

        **Then three sentences.** What happens, what should happen, who runs
        into it. Not a report with headings and fields: prose. If you are
        letting an AI agent write this, give it that ceiling — left alone it
        will produce two thousand words of context we already have.

  - type: textarea
    id: what
    attributes:
      label: What happens
      description: >-
        Three sentences of prose. What goes wrong, what you expected instead,
        and who runs into it.
      placeholder: |
        Saving a tagline longer than 255 characters throws the member out to an
        error page instead of telling them it is too long. The form should
        refuse it with a field error and a character counter. Anybody who
        writes a long tagline hits this.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
      placeholder: |
        1. Open /me/tagline/edit
        2. Paste 300 characters
        3. Save -> error page
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Where and when
      description: >-
        The URL, plus a screenshot if you have one. For a bug on vutuv.de please
        add the exact time including seconds and time zone, so we can find the
        request in the log.
      placeholder: |
        /me/tagline/edit, 2026-08-30 14:22:07 CEST, Firefox on Android
